<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Hub</title>

    <link rel="stylesheet" data-th-href="@{'/css/output.css'}" />
  </head>

  <body
    class="flex min-h-screen items-center justify-center bg-slate-50 bg-[radial-gradient(circle,#cbd5e1_1px,transparent_1px)] p-6 text-slate-900 antialiased [background-size:22px_22px]"
  >
    <main
      class="w-full max-w-2xl rounded-2xl bg-white p-8 shadow-xl shadow-slate-200/60 ring-1 ring-slate-200 sm:p-12"
    >
      <div class="mb-12 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600">
            <svg
              viewBox="0 0 24 24"
              class="h-4 w-4 text-white"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="6" cy="12" r="2.5" />
              <circle cx="18" cy="12" r="2.5" />
              <path d="M8.5 12h7" />
            </svg>
          </span>
          <span class="text-sm font-semibold tracking-tight">Connect Hub</span>
        </div>

        <div class="flex items-center" aria-hidden="true">
          <span class="h-2.5 w-2.5 rounded-full bg-indigo-600 ring-4 ring-indigo-100"></span>
          <span class="h-px w-8 bg-indigo-200 sm:w-12"></span>
          <span class="h-2.5 w-2.5 rounded-full bg-indigo-400 ring-4 ring-indigo-100"></span>
          <span class="h-px w-8 bg-indigo-200 sm:w-12"></span>
          <span class="h-2.5 w-2.5 rounded-full bg-indigo-200 ring-4 ring-indigo-50"></span>
        </div>
      </div>

      <h1
        data-th-text="${name}"
        class="mb-5 text-4xl font-semibold leading-tight tracking-tight text-slate-900 sm:text-5xl"
      >
        This is the Home Page
      </h1>

      <p class="max-w-md text-base leading-7 text-slate-500 sm:text-lg">
        Welcome to Connect Hub. Find out what we offer, explore the features,
        and connect with others in the community.
      </p>

      <div class="mt-10 border-t border-slate-100 pt-6">
        <div
          class="inline-flex items-center gap-2 rounded-full bg-emerald-50 px-3 py-1 text-sm font-medium text-emerald-700 ring-1 ring-inset ring-emerald-600/20"
        >
          <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-emerald-500"></span>
          <p data-th-text="${unnacessery}">Oops, it didn’t work.</p>
        </div>
      </div>
    </main>
  </body>
</html>
